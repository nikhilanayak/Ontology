<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>All-22 Reconstruction</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header><h1>All-22 Reconstruction</h1><span id="status">Loading…</span></header>
  <main>
    <aside>
      <label>Game<select id="games"></select></label>
      <div id="plays"></div>
    </aside>
    <section class="workspace">
      <div class="summary"><h2 id="play-title">Select a play</h2><p id="play-detail"></p></div>
      <video id="film" controls preload="metadata"></video>
      <div id="sources" class="sources"></div>
      <canvas id="field" width="1200" height="533"></canvas>
      <div class="controls"><button id="play-animation">Play field animation</button><input id="timeline" type="range" min="0" max="0" value="0"><span id="clock">0.0s</span></div>
      <pre id="diagnostics"></pre>
    </section>
  </main>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
