<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>All-22 Reconstruction</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/trajectory.css">
</head>
<body>
  <header><h1>All-22 Reconstruction</h1><span id="status">Loading…</span></header>
  <main>
    <aside>
      <label>Game<select id="games"></select></label>
      <label>Workspace<select id="workspace-mode"><option value="shots">Trajectory shots</option><option value="audit">Alignment audit</option></select></label>
      <p id="queue-help" class="queue-help">Camera shots are processed independently before repeated views are paired.</p>
      <div id="plays"></div>
    </aside>
    <section class="workspace">
      <div class="summary"><h2 id="play-title">Select a play</h2><p id="play-detail"></p></div>
      <div class="video-stage"><video id="film" controls preload="metadata"></video><canvas id="overlay"></canvas></div>
      <div id="sources" class="sources"></div>
      <fieldset id="calibration" hidden>
        <legend>Shot calibration</legend>
        <p>Paste timestamped image↔field landmark sets (pixels to yards).</p>
        <textarea id="calibration-json" rows="5" placeholder='{"keyframes":[{"timestamp_s":12.0,"image_points":[...],"field_points":[...]}]}'></textarea>
        <button id="calibration-save">Save calibration</button><span id="calibration-status"></span>
      </fieldset>
      <fieldset id="audit" hidden>
        <legend>Alignment audit</legend>
        <label><input id="audit-mapping" type="checkbox"> Correct play</label>
        <label><input id="audit-sources" type="checkbox"> Correct source clips</label>
        <label><input id="audit-timing" type="checkbox"> Correct snap/end timing</label>
        <input id="audit-notes" type="text" placeholder="Notes (optional)">
        <button id="audit-save">Save audit</button><span id="audit-status"></span>
      </fieldset>
      <fieldset id="timing" hidden>
        <legend>Source timing correction</legend>
        <select id="timing-source"></select>
        <label>Snap (video seconds)<input id="timing-snap" type="number" step="0.01"></label>
        <label>Play end<input id="timing-end" type="number" step="0.01"></label>
        <button id="timing-save">Save timing</button><span id="timing-status"></span>
      </fieldset>
      <canvas id="field" width="1200" height="533"></canvas>
      <div class="controls"><button id="play-animation">Play field animation</button><input id="timeline" type="range" min="0" max="0" value="0"><span id="clock">0.0s</span></div>
      <pre id="diagnostics"></pre>
    </section>
  </main>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
